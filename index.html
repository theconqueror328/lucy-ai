<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LUCY AI</title>

  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family:
        Arial,
        Helvetica,
        sans-serif;
      background: #ffffff;
      color: #111111;
      overflow: hidden;
    }


    body {
      display: flex;
      justify-content: center;
    }


    /* =========================
       APP
    ========================= */

    .app {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      background: #ffffff;
    }


    /* =========================
       HEADER
    ========================= */

    .header {
      height: 60px;
      min-height: 60px;

      display: flex;
      align-items: center;

      padding: 0 12px;

      border-bottom: 1px solid #eeeeee;

      background: #ffffff;

      position: relative;
      z-index: 5;
    }


    .menu-button {
      width: 42px;
      height: 42px;

      border: none;
      background: transparent;

      border-radius: 12px;

      font-size: 23px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      transition: 0.2s;
    }


    .menu-button:hover {
      background: #f2f2f2;
    }


    .logo-area {
      display: flex;
      align-items: center;

      margin-left: 5px;
    }


    .logo {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }


    .logo-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #111111;

      margin-left: 5px;
    }


    /* =========================
       SIDEBAR OVERLAY
    ========================= */

    .sidebar-overlay {
      position: fixed;

      inset: 0;

      background: rgba(
        0,
        0,
        0,
        0.35
      );

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.25s ease,
        visibility 0.25s ease;

      z-index: 20;
    }


    .sidebar-overlay.open {
      opacity: 1;
      visibility: visible;
    }


    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      position: fixed;

      top: 0;
      left: 0;

      width: 310px;
      max-width: 85vw;

      height: 100vh;

      background: #ffffff;

      box-shadow:
        4px 0 20px
        rgba(0, 0, 0, 0.12);

      transform:
        translateX(-100%);

      transition:
        transform 0.25s ease;

      z-index: 21;

      display: flex;
      flex-direction: column;
    }


    .sidebar.open {
      transform:
        translateX(0);
    }


    /* =========================
       SIDEBAR TOP
    ========================= */

    .sidebar-top {
      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 12px;

      border-bottom:
        1px solid #eeeeee;
    }


    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }


    .sidebar-brand-name {
      font-size: 20px;
      font-weight: 700;
    }


    .close-sidebar {
      width: 40px;
      height: 40px;

      border: none;

      background: transparent;

      border-radius: 10px;

      font-size: 22px;

      cursor: pointer;
    }


    .close-sidebar:hover {
      background: #f2f2f2;
    }


    /* =========================
       PROFILE
    ========================= */

    .profile-card {
      margin: 14px 12px 10px;

      padding: 12px;

      border: 1px solid #eeeeee;

      border-radius: 14px;

      display: flex;
      align-items: center;

      gap: 11px;

      background: #fafafa;
    }


    .avatar {
      width: 42px;
      height: 42px;

      border-radius: 50%;

      background: #111111;
      color: #ffffff;

      display: flex;
      align-items: center;
      justify-content: center;

      font-weight: 700;
      font-size: 17px;
    }


    .profile-info {
      flex: 1;
      min-width: 0;
    }


    .profile-name {
      font-weight: 700;
      font-size: 14px;
    }


    .profile-status {
      margin-top: 3px;

      color: #777777;

      font-size: 12px;
    }


    /* =========================
       NEW CHAT
    ========================= */

    .new-chat-button {
      margin:
        4px 12px 12px;

      width:
        calc(100% - 24px);

      padding: 12px 14px;

      border: 1px solid #dddddd;

      background: #ffffff;

      border-radius: 12px;

      font-size: 14px;

      font-weight: 600;

      cursor: pointer;

      text-align: left;

      display: flex;
      align-items: center;

      gap: 9px;

      transition: 0.2s;
    }


    .new-chat-button:hover {
      background: #f5f5f5;
    }


    /* =========================
       HISTORY TITLE
    ========================= */

    .history-title {
      padding:
        8px 15px 8px;

      font-size: 12px;

      font-weight: 700;

      color: #777777;

      text-transform: uppercase;

      letter-spacing: 0.5px;
    }


    /* =========================
       CONVERSATION LIST
    ========================= */

    .conversation-list {
      flex: 1;

      overflow-y: auto;

      padding:
        0 8px 12px;
    }


    .conversation-row {
      display: flex;
      align-items: center;

      width: 100%;

      margin-bottom: 3px;
    }


    .conversation-item {
      flex: 1;

      min-width: 0;

      border: none;

      background: transparent;

      padding: 10px 9px;

      border-radius: 10px;

      cursor: pointer;

      text-align: left;

      font-size: 13px;

      color: #222222;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      transition: 0.2s;
    }


    .conversation-item:hover {
      background: #f3f3f3;
    }


    .conversation-item.active {
      background: #eeeeee;

      font-weight: 600;
    }


    .rename-button {
      width: 34px;
      height: 34px;

      border: none;

      background: transparent;

      border-radius: 8px;

      cursor: pointer;

      font-size: 14px;

      flex-shrink: 0;
    }


    .rename-button:hover {
      background: #eeeeee;
    }


    .empty-history {
      padding:
        20px 12px;

      text-align: center;

      color: #888888;

      font-size: 13px;

      line-height: 1.5;
    }


    /* =========================
       SIDEBAR BOTTOM
    ========================= */

    .sidebar-bottom {
      padding: 12px;

      border-top:
        1px solid #eeeeee;

      font-size: 11px;

      color: #888888;

      text-align: center;
    }


    /* =========================
       CHAT
    ========================= */

    .chat {
      flex: 1;

      overflow-y: auto;

      padding:
        20px 14px 100px;

      display: flex;
      flex-direction: column;

      gap: 12px;
    }


    .message {
      max-width: 82%;

      padding:
        10px 13px;

      border-radius: 16px;

      line-height: 1.45;

      font-size: 14px;

      white-space: pre-wrap;

      word-wrap: break-word;
    }


    .message.user {
      align-self: flex-end;

      background: #111111;

      color: #ffffff;

      border-bottom-right-radius: 5px;
    }


    .message.assistant {
      align-self: flex-start;

      background: #f1f1f1;

      color: #111111;

      border-bottom-left-radius: 5px;
    }


    .welcome {
      text-align: center;

      margin:
        auto 20px;

      color: #777777;

      line-height: 1.5;
    }


    .welcome strong {
      color: #111111;

      font-size: 22px;

      display: block;

      margin-bottom: 7px;
    }


    /* =========================
       INPUT AREA
    ========================= */

    .input-area {
      position: absolute;

      bottom: 0;
      left: 0;
      right: 0;

      padding:
        10px 12px 14px;

      background:
        linear-gradient(
          to top,
          #ffffff 75%,
          rgba(255,255,255,0)
        );
    }


    .input-box {
      display: flex;

      align-items: flex-end;

      gap: 8px;

      background: #f3f3f3;

      border:
        1px solid #e3e3e3;

      border-radius: 18px;

      padding:
        7px 7px 7px 12px;
    }


    #messageInput {
      flex: 1;

      border: none;

      outline: none;

      resize: none;

      background: transparent;

      font-family: inherit;

      font-size: 14px;

      max-height: 120px;

      min-height: 25px;
    }


    .send-button {
      width: 38px;
      height: 38px;

      border: none;

      border-radius: 12px;

      background: #111111;

      color: #ffffff;

      cursor: pointer;

      font-size: 17px;

      flex-shrink: 0;
    }


    .send-button:disabled {
      opacity: 0.4;

      cursor: not-allowed;
    }


    /* =========================
       LOADING
    ========================= */

    .typing {
      display: inline-flex;

      gap: 4px;
    }


    .typing span {
      width: 5px;
      height: 5px;

      background: #777777;

      border-radius: 50%;

      animation:
        typing 1.2s infinite;
    }


    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }


    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }


    @keyframes typing {

      0%,
      60%,
      100% {
        opacity: 0.25;
      }

      30% {
        opacity: 1;
      }

    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .app {
        max-width: none;
      }

      .sidebar {
        width: 300px;
      }

      .message {
        max-width: 88%;
      }

    }

  </style>

</head>


<body>


  <div class="app">


    <!-- =========================
         MAIN HEADER
    ========================= -->

    <header class="header">

      <button
        class="menu-button"
        id="menuButton"
        aria-label="Open menu"
      >
        ☰
      </button>


      <div class="logo-area">

        <div class="logo">
          LUCY
        </div>

        <div class="logo-dot"></div>

      </div>

    </header>



    <!-- =========================
         CHAT
    ========================= -->

    <main
      class="chat"
      id="chat"
    >
    </main>



    <!-- =========================
         INPUT
    ========================= -->

    <div class="input-area">

      <div class="input-box">

        <textarea
          id="messageInput"
          placeholder="Message LUCY..."
          rows="1"
        ></textarea>


        <button
          class="send-button"
          id="sendButton"
          onclick="sendMessage()"
        >
          ↑
        </button>

      </div>

    </div>


  </div>



  <!-- =========================
       SIDEBAR OVERLAY
  ========================= -->

  <div
    class="sidebar-overlay"
    id="sidebarOverlay"
  ></div>



  <!-- =========================
       SIDEBAR
  ========================= -->

  <aside
    class="sidebar"
    id="sidebar"
  >


    <div class="sidebar-top">

      <div class="sidebar-brand">

        <div class="avatar">
          L
        </div>

        <div class="sidebar-brand-name">
          LUCY
        </div>

      </div>


      <button
        class="close-sidebar"
        id="closeSidebar"
        aria-label="Close menu"
      >
        ×
      </button>

    </div>



    <!-- PROFILE -->

    <div class="profile-card">

      <div class="avatar">
        U
      </div>


      <div class="profile-info">

        <div class="profile-name">
          LUCY User
        </div>

        <div class="profile-status">
          Not signed in
        </div>

      </div>

    </div>



    <!-- NEW CHAT -->

    <button
      class="new-chat-button"
      onclick="startNewChat()"
    >
      <span>＋</span>
      <span>New Chat</span>
    </button>



    <!-- HISTORY -->

    <div class="history-title">
      Conversation History
    </div>


    <div
      class="conversation-list"
      id="conversationList"
    >
    </div>



    <div class="sidebar-bottom">
      LUCY AI
    </div>


  </aside>



  <script>

    /* =========================
       ELEMENTS
    ========================= */

    const chat =
      document.getElementById(
        "chat"
      );

    const messageInput =
      document.getElementById(
        "messageInput"
      );

    const sendButton =
      document.getElementById(
        "sendButton"
      );

    const sidebar =
      document.getElementById(
        "sidebar"
      );

    const sidebarOverlay =
      document.getElementById(
        "sidebarOverlay"
      );

    const menuButton =
      document.getElementById(
        "menuButton"
      );

    const closeSidebar =
      document.getElementById(
        "closeSidebar"
      );

    const conversationList =
      document.getElementById(
        "conversationList"
      );



    /* =========================
       STATE
    ========================= */

    let conversationId =
      localStorage.getItem(
        "lucyConversationId"
      );


    let conversationMessages = [];



    /* =========================
       SIDEBAR
    ========================= */

    function openSidebar() {

      sidebar.classList.add(
        "open"
      );

      sidebarOverlay.classList.add(
        "open"
      );

      loadConversations();

    }


    function closeSidebarMenu() {

      sidebar.classList.remove(
        "open"
      );

      sidebarOverlay.classList.remove(
        "open"
      );

    }


    menuButton.addEventListener(
      "click",
      openSidebar
    );


    closeSidebar.addEventListener(
      "click",
      closeSidebarMenu
    );


    sidebarOverlay.addEventListener(
      "click",
      closeSidebarMenu
    );



    /* =========================
       MESSAGE
    ========================= */

    function addMessage(
      role,
      content
    ) {

      const message =
        document.createElement(
          "div"
        );

      message.className =
        "message " + role;

      message.textContent =
        content;

      chat.appendChild(
        message
      );

      chat.scrollTop =
        chat.scrollHeight;

    }



    /* =========================
       WELCOME
    ========================= */

    function showWelcomeMessage() {

      chat.innerHTML = "";

      const welcome =
        document.createElement(
          "div"
        );

      welcome.className =
        "welcome";

      welcome.innerHTML = `
        <strong>Hi! I'm LUCY. 👋</strong>
        I'm ready to chat with you.
      `;

      chat.appendChild(
        welcome
      );

    }



    /* =========================
       HIGHLIGHT ACTIVE CHAT
    ========================= */

    function highlightActiveConversation() {

      document
        .querySelectorAll(
          ".conversation-item"
        )
        .forEach(item => {

          if (
            item.dataset.id ==
            conversationId
          ) {

            item.classList.add(
              "active"
            );

          } else {

            item.classList.remove(
              "active"
            );

          }

        });

    }



    /* =========================
       LOAD CONVERSATIONS
    ========================= */

    async function loadConversations() {

      try {

        const response =
          await fetch(
            "/api/conversations"
          );


        const data =
          await response.json();


        conversationList.innerHTML =
          "";


        if (
          !data.conversations ||
          data.conversations.length === 0
        ) {

          conversationList.innerHTML = `
            <div class="empty-history">
              No conversations yet.<br>
              Start a new chat with LUCY.
            </div>
          `;

          return;

        }


        data.conversations.forEach(
          conversation => {

            const row =
              document.createElement(
                "div"
              );

            row.className =
              "conversation-row";


            const button =
              document.createElement(
                "button"
              );

            button.className =
              "conversation-item";

            button.dataset.id =
              conversation.id;

            button.textContent =
              "💬 " +
              (
                conversation.title ||
                "New conversation"
              );


            button.onclick =
              () => {

                openConversation(
                  conversation.id
                );

              };


            const renameButton =
              document.createElement(
                "button"
              );

            renameButton.className =
              "rename-button";

            renameButton.textContent =
              "✏️";


            renameButton.onclick =
              async event => {

                event.stopPropagation();

                await renameConversation(
                  conversation.id,
                  conversation.title ||
                    "New conversation"
                );

              };


            row.appendChild(
              button
            );

            row.appendChild(
              renameButton
            );


            conversationList.appendChild(
              row
            );

          }
        );


        highlightActiveConversation();


      } catch (error) {

        console.error(
          "Conversation loading error:",
          error
        );

      }

    }



    /* =========================
       OPEN CONVERSATION
    ========================= */

    async function openConversation(
      id
    ) {

      conversationId =
        String(id);


      localStorage.setItem(
        "lucyConversationId",
        conversationId
      );


      await loadConversation(
        conversationId
      );


      highlightActiveConversation();

      closeSidebarMenu();

    }



    /* =========================
       LOAD CONVERSATION
    ========================= */

    async function loadConversation(
      id
    ) {

      try {

        const response =
          await fetch(
            `/api/history?conversationId=${id}`
          );


        const data =
          await response.json();


        chat.innerHTML = "";


        conversationMessages =
          [];


        if (
          !data.messages ||
          data.messages.length === 0
        ) {

          showWelcomeMessage();

          return;

        }


        data.messages.forEach(
          message => {

            conversationMessages.push({

              role:
                message.role,

              content:
                message.content

            });


            addMessage(
              message.role,
              message.content
            );

          }
        );


      } catch (error) {

        console.error(
          "History loading error:",
          error
        );

        showWelcomeMessage();

      }

    }



    /* =========================
       NEW CHAT
    ========================= */

    function startNewChat() {

      conversationId =
        null;


      conversationMessages =
        [];


      localStorage.removeItem(
        "lucyConversationId"
      );


      showWelcomeMessage();


      highlightActiveConversation();


      closeSidebarMenu();

    }



    /* =========================
       RENAME
    ========================= */

    async function renameConversation(
      id,
      oldTitle
    ) {

      const newTitle =
        prompt(
          "Rename conversation:",
          oldTitle
        );


      if (
        newTitle === null ||
        !newTitle.trim()
      ) {

        return;

      }


      try {

        const response =
          await fetch(
            "/api/rename-conversation",
            {

              method: "PATCH",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  conversationId:
                    id,

                  title:
                    newTitle.trim()

                })

            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          alert(
            data.error ||
            "Could not rename conversation."
          );

          return;

        }


        await loadConversations();


      } catch (error) {

        console.error(
          "Rename error:",
          error
        );


        alert(
          "Could not rename conversation."
        );

      }

    }



    /* =========================
       SEND MESSAGE
    ========================= */

    async function sendMessage() {

      const text =
        messageInput.value.trim();


      if (!text) {
        return;
      }


      sendButton.disabled =
        true;


      messageInput.value =
        "";


      messageInput.style.height =
        "auto";


      addMessage(
        "user",
        text
      );


      conversationMessages.push({

        role: "user",

        content: text

      });


      const typing =
        document.createElement(
          "div"
        );

      typing.className =
        "message assistant";


      typing.innerHTML = `
        <div class="typing">
          <span></span>
          <span></span>
          <span></span>
        </div>
      `;


      chat.appendChild(
        typing
      );


      chat.scrollTop =
        chat.scrollHeight;


      try {

        const response =
          await fetch(
            "/api/chat",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  messages:
                    conversationMessages,

                  conversationId:
                    conversationId

                })

            }
          );


        const data =
          await response.json();


        typing.remove();


        if (!response.ok) {

          addMessage(
            "assistant",
            data.error ||
              "Something went wrong."
          );

          return;

        }


        conversationId =
          String(
            data.conversationId
          );


        localStorage.setItem(
          "lucyConversationId",
          conversationId
        );


        conversationMessages.push({

          role:
            "assistant",

          content:
            data.reply

        });


        addMessage(
          "assistant",
          data.reply
        );


        loadConversations();


      } catch (error) {

        typing.remove();


        console.error(
          "Chat error:",
          error
        );


        addMessage(
          "assistant",
          "Sorry, I couldn't connect to LUCY."
        );

      } finally {

        sendButton.disabled =
          false;

        messageInput.focus();

      }

    }



    /* =========================
       ENTER TO SEND
    ========================= */

    messageInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );



    /* =========================
       AUTO RESIZE INPUT
    ========================= */

    messageInput.addEventListener(
      "input",
      () => {

        messageInput.style.height =
          "auto";

        messageInput.style.height =
          Math.min(
            messageInput.scrollHeight,
            120
          ) + "px";

      }
    );



    /* =========================
       STARTUP
    ========================= */

    async function initializeLucy() {

      if (conversationId) {

        await loadConversation(
          conversationId
        );

      } else {

        showWelcomeMessage();

      }

      await loadConversations();

    }


    initializeLucy();

  </script>

</body>

</html>
