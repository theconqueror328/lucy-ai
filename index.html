<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LUCY AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      max-height: 850px;
      background: #12121c;
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 15px 20px;
      text-align: center;
      border-bottom: 1px solid #29293a;
      position: relative;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    .status {
      color: #8f8f9f;
      font-size: 13px;
      margin-top: 5px;
    }

    .new-chat-button {
      position: absolute;
      right: 12px;
      top: 15px;

      padding: 8px 10px;

      border: none;
      border-radius: 9px;

      background: #292943;
      color: white;

      font-size: 12px;
      font-weight: bold;

      cursor: pointer;
    }

    .new-chat-button:active {
      transform: scale(0.96);
    }

    .chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      padding: 12px 15px;
      border-radius: 15px;
      margin-bottom: 12px;
      max-width: 85%;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .lucy {
      background: #202031;
      margin-right: auto;
    }

    .user {
      background: #36365a;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #29293a;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #202031;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input::placeholder {
      color: #77778a;
    }

    button {
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      background: #6c63ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">

      <button
        class="new-chat-button"
        onclick="startNewChat()"
      >
        ＋ New Chat
      </button>

      <div class="logo">
        LUCY 🤖
      </div>

      <div class="status">
        Your AI assistant
      </div>

    </div>


    <div class="chat" id="chat">

      <div
        class="message lucy"
        id="welcomeMessage"
      >
        Hi! I'm LUCY. 👋
        <br>
        I'm ready to chat with you.
      </div>

    </div>


    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Message LUCY..."
        autocomplete="off"
      >

      <button
        id="sendButton"
        onclick="sendMessage()"
      >
        Send
      </button>

    </div>

  </div>


  <script>

    // Messages currently loaded in this chat.
    let conversation = [];

    // Current Supabase conversation ID.
    let conversationId = null;


    function addMessage(role, content) {

      const chat =
        document.getElementById("chat");

      const message =
        document.createElement("div");

      message.className =
        "message " +
        (role === "user"
          ? "user"
          : "lucy");

      message.textContent =
        content;

      chat.appendChild(message);

      chat.scrollTop =
        chat.scrollHeight;
    }


    function showWelcomeMessage() {

      const chat =
        document.getElementById("chat");

      chat.innerHTML = `
        <div
          class="message lucy"
          id="welcomeMessage"
        >
          Hi! I'm LUCY. 👋
          <br>
          I'm ready to chat with you.
        </div>
      `;
    }


    async function loadConversation() {

      const savedId =
        localStorage.getItem(
          "lucyConversationId"
        );

      if (!savedId) {
        return;
      }

      conversationId =
        savedId;


      try {

        const response =
          await fetch(
            "/api/history?conversationId=" +
            encodeURIComponent(
              conversationId
            )
          );


        const data =
          await response.json();


        if (!response.ok) {

          console.error(
            "History error:",
            data.error
          );

          return;
        }


        const messages =
          data.messages || [];


        if (messages.length === 0) {
          return;
        }


        const welcomeMessage =
          document.getElementById(
            "welcomeMessage"
          );

        if (welcomeMessage) {
          welcomeMessage.remove();
        }


        conversation =
          messages.map(message => ({
            role: message.role,
            content: message.content
          }));


        messages.forEach(message => {

          addMessage(
            message.role,
            message.content
          );

        });


      } catch (error) {

        console.error(
          "Could not load conversation:",
          error
        );

      }

    }


    function startNewChat() {

      // Forget the current conversation ID.
      conversationId = null;

      // Clear the local conversation.
      conversation = [];

      // Remove the saved conversation ID.
      localStorage.removeItem(
        "lucyConversationId"
      );

      // Clear the chat screen.
      showWelcomeMessage();

      // Put the cursor back in the input.
      document
        .getElementById(
          "messageInput"
        )
        .focus();

    }


    async function sendMessage() {

      const input =
        document.getElementById(
          "messageInput"
        );

      const chat =
        document.getElementById("chat");

      const sendButton =
        document.getElementById(
          "sendButton"
        );

      const message =
        input.value.trim();


      if (!message) {
        return;
      }


      const welcomeMessage =
        document.getElementById(
          "welcomeMessage"
        );

      if (welcomeMessage) {
        welcomeMessage.remove();
      }


      addMessage(
        "user",
        message
      );


      input.value = "";

      sendButton.disabled = true;


      conversation.push({

        role: "user",

        content: message

      });


      const thinkingMessage =
        document.createElement("div");

      thinkingMessage.className =
        "message lucy";

      thinkingMessage.textContent =
        "LUCY is thinking... 🤔";

      chat.appendChild(
        thinkingMessage
      );


      chat.scrollTop =
        chat.scrollHeight;


      try {

        const response =
          await fetch(
            "/api/chat",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                messages:
                  conversation,

                conversationId:
                  conversationId

              })

            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          thinkingMessage.textContent =
            data.error ||
            "Something went wrong.";

          conversation.pop();

          return;
        }


        if (data.conversationId) {

          conversationId =
            data.conversationId;

          localStorage.setItem(
            "lucyConversationId",
            conversationId
          );

        }


        thinkingMessage.textContent =
          data.reply ||
          "LUCY didn't receive a response.";


        conversation.push({

          role: "assistant",

          content:
            data.reply

        });


      } catch (error) {

        console.error(
          "Chat error:",
          error
        );

        thinkingMessage.textContent =
          "Could not reach LUCY's server.";

        conversation.pop();

      } finally {

        sendButton.disabled = false;

        input.focus();

      }


      chat.scrollTop =
        chat.scrollHeight;

    }


    document
      .getElementById(
        "messageInput"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

          }

        }
      );


    // Load the saved conversation when LUCY opens.
    loadConversation();

  </script>

</body>
</html>
