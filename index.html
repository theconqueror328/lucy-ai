<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>LUCY AI</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #0f0f0f;
      color: #ffffff;

      overflow: hidden;
    }


    body {
      display: flex;
      justify-content: center;
    }


    /* =================================
       APP
    ================================= */

    .app {
      width: 100%;
      max-width: 520px;

      height: 100vh;

      display: flex;
      flex-direction: column;

      position: relative;

      background: #0f0f0f;

      overflow: hidden;
    }


    /* =================================
       HEADER
    ================================= */

    .header {
      height: 60px;
      min-height: 60px;

      display: flex;
      align-items: center;

      padding: 0 10px;

      background: #0f0f0f;

      border-bottom:
        1px solid #252525;

      position: relative;

      z-index: 5;
    }


    .menu-button {
      width: 42px;
      height: 42px;

      border: none;

      background: transparent;

      color: #ffffff;

      border-radius: 12px;

      font-size: 23px;

      cursor: pointer;

      display: flex;
      align-items: center;
      justify-content: center;

      transition: 0.2s;
    }


    .menu-button:hover {
      background: #202020;
    }


    .logo-area {
      display: flex;
      align-items: center;

      margin-left: 5px;
    }


    .logo {
      font-size: 21px;

      font-weight: 700;

      letter-spacing: 0.5px;
    }


    .logo-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #ffffff;

      margin-left: 5px;
    }


    /* =================================
       CHAT AREA
    ================================= */

    .chat {
      flex: 1;

      min-height: 0;

      overflow-y: auto;

      padding:
        20px 14px 105px;

      display: flex;

      flex-direction: column;

      gap: 12px;
    }


    .message {
      max-width: 84%;

      padding:
        10px 13px;

      border-radius: 16px;

      line-height: 1.5;

      font-size: 14px;

      white-space: pre-wrap;

      word-wrap: break-word;
    }


    .message.user {
      align-self: flex-end;

      background: #ffffff;

      color: #111111;

      border-bottom-right-radius: 5px;
    }


    .message.assistant {
      align-self: flex-start;

      background: #202020;

      color: #ffffff;

      border-bottom-left-radius: 5px;
    }


    /* =================================
       WELCOME
    ================================= */

    .welcome {
      text-align: center;

      margin: auto 20px;

      color: #8e8e8e;

      line-height: 1.5;
    }


    .welcome strong {
      color: #ffffff;

      font-size: 23px;

      display: block;

      margin-bottom: 7px;
    }


    /* =================================
       INPUT AREA
    ================================= */

    .input-area {
      position: absolute;

      left: 0;
      right: 0;

      bottom: 0;

      z-index: 10;

      padding:
        10px 12px 14px;

      background:
        linear-gradient(
          to top,
          #0f0f0f 72%,
          rgba(15, 15, 15, 0)
        );

      pointer-events: none;
    }


    .input-box {
      pointer-events: auto;

      display: flex;

      align-items: flex-end;

      gap: 8px;

      background: #1d1d1d;

      border:
        1px solid #303030;

      border-radius: 18px;

      padding:
        7px 7px 7px 12px;

      position: relative;

      z-index: 11;
    }


    #messageInput {
      flex: 1;

      width: 100%;

      border: none;

      outline: none;

      resize: none;

      background: transparent;

      color: #ffffff;

      font-family: inherit;

      font-size: 14px;

      line-height: 1.4;

      max-height: 120px;

      min-height: 25px;

      padding: 6px 0;
    }


    #messageInput::placeholder {
      color: #777777;
    }


    .send-button {
      width: 38px;
      height: 38px;

      border: none;

      border-radius: 12px;

      background: #ffffff;

      color: #111111;

      cursor: pointer;

      font-size: 18px;

      font-weight: bold;

      flex-shrink: 0;

      display: flex;

      align-items: center;

      justify-content: center;
    }


    .send-button:hover {
      background: #dddddd;
    }


    .send-button:disabled {
      opacity: 0.35;

      cursor: not-allowed;
    }


    /* =================================
       SIDEBAR OVERLAY
    ================================= */

    .sidebar-overlay {
      position: fixed;

      inset: 0;

      background:
        rgba(0, 0, 0, 0.65);

      opacity: 0;

      visibility: hidden;

      transition:
        opacity 0.25s ease,
        visibility 0.25s ease;

      z-index: 100;
    }


    .sidebar-overlay.open {
      opacity: 1;

      visibility: visible;
    }


    /* =================================
       SIDEBAR
    ================================= */

    .sidebar {
      position: fixed;

      top: 0;
      left: 0;

      width: 310px;

      max-width: 85vw;

      height: 100vh;

      background: #171717;

      color: #ffffff;

      box-shadow:
        5px 0 25px
        rgba(0, 0, 0, 0.45);

      transform:
        translateX(-105%);

      transition:
        transform 0.25s ease;

      z-index: 101;

      display: flex;

      flex-direction: column;

      overflow: hidden;
    }


    .sidebar.open {
      transform:
        translateX(0);
    }


    /* =================================
       SIDEBAR TOP
    ================================= */

    .sidebar-top {
      height: 62px;

      min-height: 62px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding:
        10px 12px;

      border-bottom:
        1px solid #292929;
    }


    .sidebar-brand {
      display: flex;

      align-items: center;

      gap: 9px;
    }


    .sidebar-brand-name {
      font-size: 20px;

      font-weight: 700;
    }


    .close-sidebar {
      width: 40px;
      height: 40px;

      border: none;

      background: transparent;

      color: #ffffff;

      border-radius: 10px;

      font-size: 25px;

      cursor: pointer;
    }


    .close-sidebar:hover {
      background: #292929;
    }


    /* =================================
       AVATAR
    ================================= */

    .avatar {
      width: 40px;
      height: 40px;

      border-radius: 50%;

      background: #ffffff;

      color: #111111;

      display: flex;

      align-items: center;

      justify-content: center;

      font-weight: 700;

      font-size: 16px;

      flex-shrink: 0;
    }


    /* =================================
       PROFILE
    ================================= */

    .profile-card {
      margin:
        14px 12px 10px;

      padding:
        12px;

      border:
        1px solid #2c2c2c;

      border-radius: 14px;

      display: flex;

      align-items: center;

      gap: 11px;

      background: #202020;
    }


    .profile-info {
      flex: 1;

      min-width: 0;
    }


    .profile-name {
      font-weight: 700;

      font-size: 14px;
    }


    .profile-status {
      margin-top: 3px;

      color: #858585;

      font-size: 12px;
    }


    /* =================================
       NEW CHAT
    ================================= */

    .new-chat-button {
      margin:
        4px 12px 12px;

      width:
        calc(100% - 24px);

      padding:
        12px 14px;

      border:
        1px solid #363636;

      background: #202020;

      color: #ffffff;

      border-radius: 12px;

      font-size: 14px;

      font-weight: 600;

      cursor: pointer;

      text-align: left;

      display: flex;

      align-items: center;

      gap: 9px;

      transition: 0.2s;
    }


    .new-chat-button:hover {
      background: #2a2a2a;
    }


    .new-chat-button span:first-child {
      font-size: 19px;
    }


    /* =================================
       HISTORY TITLE
    ================================= */

    .history-title {
      padding:
        8px 15px;

      font-size: 11px;

      font-weight: 700;

      color: #777777;

      text-transform: uppercase;

      letter-spacing: 0.6px;
    }


    /* =================================
       CONVERSATION LIST
    ================================= */

    .conversation-list {
      flex: 1;

      min-height: 0;

      overflow-y: auto;

      padding:
        0 8px 12px;
    }


    .conversation-row {
      display: flex;

      align-items: center;

      width: 100%;

      margin-bottom: 3px;
    }


    .conversation-item {
      flex: 1;

      min-width: 0;

      border: none;

      background: transparent;

      color: #dddddd;

      padding:
        10px 9px;

      border-radius: 10px;

      cursor: pointer;

      text-align: left;

      font-size: 13px;

      white-space: nowrap;

      overflow: hidden;

      text-overflow: ellipsis;

      transition: 0.2s;
    }


    .conversation-item:hover {
      background: #272727;
    }


    .conversation-item.active {
      background: #303030;

      color: #ffffff;

      font-weight: 600;
    }


    .rename-button {
      width: 34px;
      height: 34px;

      border: none;

      background: transparent;

      color: #aaaaaa;

      border-radius: 8px;

      cursor: pointer;

      font-size: 14px;

      flex-shrink: 0;
    }


    .rename-button:hover {
      background: #292929;

      color: #ffffff;
    }


    .empty-history {
      padding:
        20px 12px;

      text-align: center;

      color: #777777;

      font-size: 13px;

      line-height: 1.5;
    }


    /* =================================
       SIDEBAR BOTTOM
    ================================= */

    .sidebar-bottom {
      padding:
        12px;

      border-top:
        1px solid #292929;

      font-size: 11px;

      color: #666666;

      text-align: center;
    }


    /* =================================
       TYPING INDICATOR
    ================================= */

    .typing {
      display: inline-flex;

      gap: 4px;

      padding: 3px 0;
    }


    .typing span {
      width: 5px;
      height: 5px;

      background: #aaaaaa;

      border-radius: 50%;

      animation:
        typing 1.2s infinite;
    }


    .typing span:nth-child(2) {
      animation-delay: 0.15s;
    }


    .typing span:nth-child(3) {
      animation-delay: 0.3s;
    }


    @keyframes typing {

      0%,
      60%,
      100% {
        opacity: 0.25;
      }

      30% {
        opacity: 1;
      }

    }


    /* =================================
       MOBILE
    ================================= */

    @media (max-width: 600px) {

      .app {
        max-width: none;
      }


      .sidebar {
        width: 300px;
      }


      .message {
        max-width: 88%;
      }

    }

  </style>

</head>


<body>


  <!-- =================================
       MAIN APP
  ================================= -->

  <div class="app">


    <!-- HEADER -->

    <header class="header">

      <button
        class="menu-button"
        id="menuButton"
        aria-label="Open menu"
      >
        ☰
      </button>


      <div class="logo-area">

        <div class="logo">
          LUCY
        </div>

        <div class="logo-dot"></div>

      </div>

    </header>



    <!-- CHAT -->

    <main
      class="chat"
      id="chat"
    ></main>



    <!-- INPUT -->

    <div class="input-area">

      <div class="input-box">

        <textarea
          id="messageInput"
          placeholder="Message LUCY..."
          rows="1"
          autocomplete="off"
        ></textarea>


        <button
          class="send-button"
          id="sendButton"
          aria-label="Send message"
          onclick="sendMessage()"
        >
          ↑
        </button>

      </div>

    </div>

  </div>



  <!-- =================================
       SIDEBAR OVERLAY
  ================================= -->

  <div
    class="sidebar-overlay"
    id="sidebarOverlay"
  ></div>



  <!-- =================================
       SIDEBAR
  ================================= -->

  <aside
    class="sidebar"
    id="sidebar"
  >


    <!-- SIDEBAR HEADER -->

    <div class="sidebar-top">

      <div class="sidebar-brand">

        <div class="avatar">
          L
        </div>

        <div class="sidebar-brand-name">
          LUCY
        </div>

      </div>


      <button
        class="close-sidebar"
        id="closeSidebar"
        aria-label="Close menu"
      >
        ×
      </button>

    </div>



    <!-- PROFILE -->

    <div class="profile-card">

      <div class="avatar">
        U
      </div>


      <div class="profile-info">

        <div class="profile-name">
          LUCY User
        </div>

        <div class="profile-status">
          Not signed in
        </div>

      </div>

    </div>



    <!-- NEW CHAT -->

    <button
      class="new-chat-button"
      id="newChatButton"
    >

      <span>＋</span>

      <span>
        New Chat
      </span>

    </button>



    <!-- HISTORY TITLE -->

    <div class="history-title">
      Conversation History
    </div>



    <!-- HISTORY -->

    <div
      class="conversation-list"
      id="conversationList"
    ></div>



    <!-- SIDEBAR FOOTER -->

    <div class="sidebar-bottom">
      LUCY AI
    </div>


  </aside>



  <script>

    /* =================================
       ELEMENTS
    ================================= */

    const chat =
      document.getElementById(
        "chat"
      );


    const messageInput =
      document.getElementById(
        "messageInput"
      );


    const sendButton =
      document.getElementById(
        "sendButton"
      );


    const sidebar =
      document.getElementById(
        "sidebar"
      );


    const sidebarOverlay =
      document.getElementById(
        "sidebarOverlay"
      );


    const menuButton =
      document.getElementById(
        "menuButton"
      );


    const closeSidebar =
      document.getElementById(
        "closeSidebar"
      );


    const newChatButton =
      document.getElementById(
        "newChatButton"
      );


    const conversationList =
      document.getElementById(
        "conversationList"
      );



    /* =================================
       STATE
    ================================= */

    let conversationId =
      localStorage.getItem(
        "lucyConversationId"
      );


    let conversationMessages = [];



    /* =================================
       SIDEBAR
    ================================= */

    function openSidebar() {

      sidebar.classList.add(
        "open"
      );

      sidebarOverlay.classList.add(
        "open"
      );

      loadConversations();

    }


    function closeSidebarMenu() {

      sidebar.classList.remove(
        "open"
      );

      sidebarOverlay.classList.remove(
        "open"
      );

    }


    menuButton.addEventListener(
      "click",
      openSidebar
    );


    closeSidebar.addEventListener(
      "click",
      closeSidebarMenu
    );


    sidebarOverlay.addEventListener(
      "click",
      closeSidebarMenu
    );



    /* =================================
       NEW CHAT
    ================================= */

    newChatButton.addEventListener(
      "click",
      startNewChat
    );



    /* =================================
       ADD MESSAGE
    ================================= */

    function addMessage(
      role,
      content
    ) {

      const message =
        document.createElement(
          "div"
        );


      message.className =
        "message " + role;


      message.textContent =
        content;


      chat.appendChild(
        message
      );


      chat.scrollTop =
        chat.scrollHeight;

    }



    /* =================================
       WELCOME
    ================================= */

    function showWelcomeMessage() {

      chat.innerHTML = "";


      const welcome =
        document.createElement(
          "div"
        );


      welcome.className =
        "welcome";


      welcome.innerHTML = `
        <strong>Hi! I'm LUCY. 👋</strong>
        I'm ready to chat with you.
      `;


      chat.appendChild(
        welcome
      );

    }



    /* =================================
       ACTIVE CONVERSATION
    ================================= */

    function highlightActiveConversation() {

      document
        .querySelectorAll(
          ".conversation-item"
        )
        .forEach(item => {

          if (
            item.dataset.id ==
            conversationId
          ) {

            item.classList.add(
              "active"
            );

          } else {

            item.classList.remove(
              "active"
            );

          }

        });

    }



    /* =================================
       LOAD CONVERSATIONS
    ================================= */

    async function loadConversations() {

      try {

        const response =
          await fetch(
            "/api/conversations"
          );


        const data =
          await response.json();


        conversationList.innerHTML =
          "";


        if (
          !data.conversations ||
          data.conversations.length === 0
        ) {

          conversationList.innerHTML = `
            <div class="empty-history">
              No conversations yet.<br>
              Start a new chat with LUCY.
            </div>
          `;

          return;

        }


        data.conversations.forEach(
          conversation => {

            const row =
              document.createElement(
                "div"
              );


            row.className =
              "conversation-row";


            const button =
              document.createElement(
                "button"
              );


            button.className =
              "conversation-item";


            button.dataset.id =
              conversation.id;


            button.textContent =
              "💬 " +
              (
                conversation.title ||
                "New conversation"
              );


            button.onclick =
              () => {

                openConversation(
                  conversation.id
                );

              };


            const renameButton =
              document.createElement(
                "button"
              );


            renameButton.className =
              "rename-button";


            renameButton.textContent =
              "✏️";


            renameButton.onclick =
              async event => {

                event.stopPropagation();


                await renameConversation(
                  conversation.id,
                  conversation.title ||
                    "New conversation"
                );

              };


            row.appendChild(
              button
            );


            row.appendChild(
              renameButton
            );


            conversationList.appendChild(
              row
            );

          }
        );


        highlightActiveConversation();

      } catch (error) {

        console.error(
          "Conversation loading error:",
          error
        );

      }

    }



    /* =================================
       OPEN CONVERSATION
    ================================= */

    async function openConversation(
      id
    ) {

      conversationId =
        String(id);


      localStorage.setItem(
        "lucyConversationId",
        conversationId
      );


      await loadConversation(
        conversationId
      );


      highlightActiveConversation();


      closeSidebarMenu();

    }



    /* =================================
       LOAD CONVERSATION
    ================================= */

    async function loadConversation(
      id
    ) {

      try {

        const response =
          await fetch(
            `/api/history?conversationId=${id}`
          );


        const data =
          await response.json();


        chat.innerHTML =
          "";


        conversationMessages =
          [];


        if (
          !data.messages ||
          data.messages.length === 0
        ) {

          showWelcomeMessage();

          return;

        }


        data.messages.forEach(
          message => {

            conversationMessages.push({

              role:
                message.role,

              content:
                message.content

            });


            addMessage(
              message.role,
              message.content
            );

          }
        );


      } catch (error) {

        console.error(
          "History loading error:",
          error
        );


        showWelcomeMessage();

      }

    }



    /* =================================
       START NEW CHAT
    ================================= */

    function startNewChat() {

      conversationId =
        null;


      conversationMessages =
        [];


      localStorage.removeItem(
        "lucyConversationId"
      );


      showWelcomeMessage();


      closeSidebarMenu();


      highlightActiveConversation();


      messageInput.focus();

    }



    /* =================================
       RENAME CONVERSATION
    ================================= */

    async function renameConversation(
      id,
      oldTitle
    ) {

      const newTitle =
        prompt(
          "Rename conversation:",
          oldTitle
        );


      if (
        newTitle === null ||
        !newTitle.trim()
      ) {

        return;

      }


      try {

        const response =
          await fetch(
            "/api/rename-conversation",
            {

              method: "PATCH",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  conversationId:
                    id,

                  title:
                    newTitle.trim()

                })

            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          alert(
            data.error ||
            "Could not rename conversation."
          );

          return;

        }


        await loadConversations();


      } catch (error) {

        console.error(
          "Rename error:",
          error
        );


        alert(
          "Could not rename conversation."
        );

      }

    }



    /* =================================
       SEND MESSAGE
    ================================= */

    async function sendMessage() {

      const text =
        messageInput.value.trim();


      if (!text) {
        return;
      }


      sendButton.disabled =
        true;


      messageInput.value =
        "";


      messageInput.style.height =
        "auto";


      addMessage(
        "user",
        text
      );


      conversationMessages.push({

        role:
          "user",

        content:
          text

      });


      const typing =
        document.createElement(
          "div"
        );


      typing.className =
        "message assistant";


      typing.innerHTML = `
        <div class="typing">
          <span></span>
          <span></span>
          <span></span>
        </div>
      `;


      chat.appendChild(
        typing
      );


      chat.scrollTop =
        chat.scrollHeight;


      try {

        const response =
          await fetch(
            "/api/chat",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  messages:
                    conversationMessages,

                  conversationId:
                    conversationId

                })

            }
          );


        const data =
          await response.json();


        typing.remove();


        if (!response.ok) {

          addMessage(
            "assistant",
            data.error ||
              "Something went wrong."
          );

          return;

        }


        conversationId =
          String(
            data.conversationId
          );


        localStorage.setItem(
          "lucyConversationId",
          conversationId
        );


        conversationMessages.push({

          role:
            "assistant",

          content:
            data.reply

        });


        addMessage(
          "assistant",
          data.reply
        );


        loadConversations();


      } catch (error) {

        typing.remove();


        console.error(
          "Chat error:",
          error
        );


        addMessage(
          "assistant",
          "Sorry, I couldn't connect to LUCY."
        );

      } finally {

        sendButton.disabled =
          false;


        messageInput.focus();

      }

    }



    /* =================================
       ENTER TO SEND
    ================================= */

    messageInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );



    /* =================================
       AUTO RESIZE INPUT
    ================================= */

    messageInput.addEventListener(
      "input",
      () => {

        messageInput.style.height =
          "auto";


        messageInput.style.height =
          Math.min(
            messageInput.scrollHeight,
            120
          ) + "px";

      }
    );



    /* =================================
       ESCAPE CLOSES SIDEBAR
    ================================= */

    document.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Escape"
        ) {

          closeSidebarMenu();

        }

      }
    );



    /* =================================
       INITIALIZE LUCY
    ================================= */

    async function initializeLucy() {

      if (conversationId) {

        await loadConversation(
          conversationId
        );

      } else {

        showWelcomeMessage();

      }


      await loadConversations();


      messageInput.focus();

    }


    initializeLucy();

  </script>

</body>
