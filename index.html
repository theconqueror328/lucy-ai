<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LUCY AI</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      width: 100%;
      max-width: 500px;
      height: 100vh;
      max-height: 850px;
      background: #12121c;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .header {
      padding: 15px 20px;
      text-align: center;
      border-bottom: 1px solid #29293a;
      position: relative;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
    }

    .status {
      color: #8f8f9f;
      font-size: 13px;
      margin-top: 5px;
    }

    .new-chat-button {
      position: absolute;
      right: 12px;
      top: 15px;

      padding: 8px 10px;

      border: none;
      border-radius: 9px;

      background: #292943;
      color: white;

      font-size: 12px;
      font-weight: bold;

      cursor: pointer;
    }

    .new-chat-button:hover {
      background: #353552;
    }

    .new-chat-button:active {
      transform: scale(0.96);
    }

    .chat-list {
      border-bottom: 1px solid #29293a;
      padding: 12px;
      max-height: 190px;
      overflow-y: auto;
    }

    .chat-list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      padding: 0 5px;
    }

    .chat-list-title {
      font-size: 13px;
      color: #8f8f9f;
      font-weight: bold;
    }

    .refresh-button {
      background: transparent;
      color: #8f8f9f;
      padding: 3px 7px;
      font-size: 16px;
    }

    .refresh-button:hover {
      color: white;
      background: #202031;
    }

    .conversation-item {
      width: 100%;
      padding: 11px 12px;
      margin-bottom: 6px;

      border: none;
      border-radius: 10px;

      background: #1c1c2a;
      color: white;

      text-align: left;
      font-size: 13px;

      cursor: pointer;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      transition: 0.15s;
    }

    .conversation-item:hover {
      background: #25253a;
    }

    .conversation-item.active {
      background: #36365a;
      box-shadow: inset 3px 0 0 #6c63ff;
    }

    .conversation-item:active {
      transform: scale(0.99);
    }

    .empty-chats {
      color: #77778a;
      font-size: 13px;
      padding: 8px 5px;
    }

    .chat {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }

    .message {
      padding: 12px 15px;
      border-radius: 15px;
      margin-bottom: 12px;
      max-width: 85%;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .lucy {
      background: #202031;
      margin-right: auto;
    }

    .user {
      background: #36365a;
      margin-left: auto;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #29293a;
    }

    input {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #202031;
      color: white;
      outline: none;
      font-size: 15px;
    }

    input::placeholder {
      color: #77778a;
    }

    .send-button {
      padding: 14px 18px;
      border: none;
      border-radius: 12px;
      background: #6c63ff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .send-button:hover {
      background: #7a72ff;
    }

    .send-button:active {
      transform: scale(0.97);
    }

    .send-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">

      <button
        class="new-chat-button"
        onclick="startNewChat()"
      >
        ＋ New Chat
      </button>

      <div class="logo">
        LUCY 🤖
      </div>

      <div class="status">
        Your AI assistant
      </div>

    </div>


    <div class="chat-list">

      <div class="chat-list-header">

        <div class="chat-list-title">
          💬 Chats
        </div>

        <button
          class="refresh-button"
          onclick="loadConversations()"
          title="Refresh chats"
        >
          ↻
        </button>

      </div>


      <div id="conversationList">

        <div class="empty-chats">
          Loading conversations...
        </div>

      </div>

    </div>


    <div class="chat" id="chat">

      <div
        class="message lucy"
        id="welcomeMessage"
      >
        Hi! I'm LUCY. 👋
        <br>
        I'm ready to chat with you.
      </div>

    </div>


    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Message LUCY..."
        autocomplete="off"
      >

      <button
        class="send-button"
        id="sendButton"
        onclick="sendMessage()"
      >
        Send
      </button>

    </div>

  </div>


  <script>

    let conversation = [];

    let conversationId = null;


    function addMessage(role, content) {

      const chat =
        document.getElementById("chat");

      const message =
        document.createElement("div");

      message.className =
        "message " +
        (role === "user"
          ? "user"
          : "lucy");

      message.textContent =
        content;

      chat.appendChild(message);

      chat.scrollTop =
        chat.scrollHeight;
    }


    function showWelcomeMessage() {

      const chat =
        document.getElementById("chat");

      chat.innerHTML = `
        <div
          class="message lucy"
          id="welcomeMessage"
        >
          Hi! I'm LUCY. 👋
          <br>
          I'm ready to chat with you.
        </div>
      `;
    }


    function highlightActiveConversation() {

      const buttons =
        document.querySelectorAll(
          ".conversation-item"
        );


      buttons.forEach(button => {

        if (
          String(button.dataset.id) ===
          String(conversationId)
        ) {

          button.classList.add("active");

        } else {

          button.classList.remove("active");

        }

      });

    }


    async function loadConversations() {

      const list =
        document.getElementById(
          "conversationList"
        );


      try {

        const response =
          await fetch(
            "/api/conversations"
          );


        const data =
          await response.json();


        if (!response.ok) {

          list.innerHTML = `
            <div class="empty-chats">
              Could not load chats.
            </div>
          `;

          return;
        }


        const conversations =
          data.conversations || [];


        if (conversations.length === 0) {

          list.innerHTML = `
            <div class="empty-chats">
              No conversations yet.
            </div>
          `;

          return;
        }


        list.innerHTML = "";


        conversations.forEach(item => {

          const button =
            document.createElement("button");

          button.className =
            "conversation-item";

          button.dataset.id =
            item.id;

          button.textContent =
            "💬 " +
            (
              item.title ||
              "New conversation"
            );


          button.onclick =
            function() {

              openConversation(
                item.id
              );

            };


          list.appendChild(button);

        });


        highlightActiveConversation();


      } catch (error) {

        console.error(
          "Could not load conversations:",
          error
        );

        list.innerHTML = `
          <div class="empty-chats">
            Could not reach the server.
          </div>
        `;

      }

    }


    async function loadConversation() {

      const savedId =
        localStorage.getItem(
          "lucyConversationId"
        );


      if (!savedId) {
        return;
      }


      conversationId =
        savedId;


      await openConversation(
        savedId
      );

    }


    async function openConversation(id) {

      conversationId = id;


      localStorage.setItem(
        "lucyConversationId",
        conversationId
      );


      highlightActiveConversation();


      const chat =
        document.getElementById("chat");


      chat.innerHTML = "";


      conversation = [];


      try {

        const response =
          await fetch(
            "/api/history?conversationId=" +
            encodeURIComponent(id)
          );


        const data =
          await response.json();


        if (!response.ok) {

          addMessage(
            "lucy",
            data.error ||
            "Could not load this conversation."
          );

          return;
        }


        const messages =
          data.messages || [];


        conversation =
          messages.map(message => ({
            role: message.role,
            content: message.content
          }));


        if (messages.length === 0) {

          showWelcomeMessage();

          return;

        }


        messages.forEach(message => {

          addMessage(
            message.role,
            message.content
          );

        });


      } catch (error) {

        console.error(
          "Could not open conversation:",
          error
        );

        addMessage(
          "lucy",
          "Could not load this conversation."
        );

      }

    }


    function startNewChat() {

      conversationId = null;

      conversation = [];


      localStorage.removeItem(
        "lucyConversationId"
      );


      showWelcomeMessage();


      highlightActiveConversation();


      document
        .getElementById(
          "messageInput"
        )
        .focus();

    }


    async function sendMessage() {

      const input =
        document.getElementById(
          "messageInput"
        );

      const chat =
        document.getElementById("chat");

      const sendButton =
        document.getElementById(
          "sendButton"
        );


      const message =
        input.value.trim();


      if (!message) {
        return;
      }


      const welcomeMessage =
        document.getElementById(
          "welcomeMessage"
        );


      if (welcomeMessage) {
        welcomeMessage.remove();
      }


      addMessage(
        "user",
        message
      );


      input.value = "";

      sendButton.disabled = true;


      conversation.push({

        role: "user",

        content: message

      });


      const thinkingMessage =
        document.createElement("div");


      thinkingMessage.className =
        "message lucy";


      thinkingMessage.textContent =
        "LUCY is thinking... 🤔";


      chat.appendChild(
        thinkingMessage
      );


      chat.scrollTop =
        chat.scrollHeight;


      try {

        const response =
          await fetch(
            "/api/chat",
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                messages:
                  conversation,

                conversationId:
                  conversationId

              })

            }
          );


        const data =
          await response.json();


        if (!response.ok) {

          thinkingMessage.textContent =
            data.error ||
            "Something went wrong.";

          conversation.pop();

          return;

        }


        if (data.conversationId) {

          conversationId =
            data.conversationId;


          localStorage.setItem(
            "lucyConversationId",
            conversationId
          );

        }


        thinkingMessage.textContent =
          data.reply ||
          "LUCY didn't receive a response.";


        conversation.push({

          role: "assistant",

          content:
            data.reply

        });


        loadConversations();


        highlightActiveConversation();


      } catch (error) {

        console.error(
          "Chat error:",
          error
        );


        thinkingMessage.textContent =
          "Could not reach LUCY's server.";


        conversation.pop();

      } finally {

        sendButton.disabled = false;

        input.focus();

      }


      chat.scrollTop =
        chat.scrollHeight;

    }


    document
      .getElementById(
        "messageInput"
      )
      .addEventListener(
        "keydown",
        function(event) {

          if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

          }

        }
      );


    loadConversation();

    loadConversations();

  </script>

</body>
</html>
