<script>
  async function sendMessage() {
    const input = document.getElementById("messageInput");
    const chat = document.getElementById("chat");

    const message = input.value.trim();

    if (!message) return;

    // Show user's message
    const userMessage = document.createElement("div");
    userMessage.className = "message user";
    userMessage.textContent = message;
    chat.appendChild(userMessage);

    input.value = "";

    // Show thinking message
    const thinkingMessage = document.createElement("div");
    thinkingMessage.className = "message lucy";
    thinkingMessage.textContent = "LUCY is thinking... 🤔";
    chat.appendChild(thinkingMessage);

    chat.scrollTop = chat.scrollHeight;

    try {
      const response = await fetch("/api/chat", {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          message: message
        })
      });

      const data = await response.json();

      if (!response.ok) {
        throw new Error(data.error || "Something went wrong.");
      }

      thinkingMessage.textContent = data.reply;

    } catch (error) {
      console.error(error);

      thinkingMessage.textContent =
        "Sorry 😅 I couldn't connect to my AI brain right now.";
    }

    chat.scrollTop = chat.scrollHeight;
  }

  // Press Enter to send
  document
    .getElementById("messageInput")
    .addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
</script>
